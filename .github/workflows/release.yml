# Builds every library, verifies it and uploads the release assets to a DRAFT release.
# Publishing stays manual: see README, "Releasing".
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Empty: v<package.json version>. Also accepts a pre-release of it (v5.0.0-rc.1). Tags are never reused."
        required: false
# No tag trigger: publishing the draft creates the tag, which would start a run that can only fail.

permissions:
  contents: write # create the draft release
  id-token: write # sign the build provenance
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Bump here and in the README requirements; the cache key includes it. The NDK version is in
  # configs.json.
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json and is new
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          TAG="${INPUT_TAG:-v$VERSION}"
          # package.json is the version being released: the tag is that version, or a
          # pre-release of it (v5.0.0-rc.1). Bump package.json in a PR before releasing.
          if [[ "$TAG" != "v$VERSION" && "$TAG" != "v$VERSION"-* ]]; then
            echo "::error::Tag $TAG doesn't match package.json version $VERSION (expected v$VERSION or v$VERSION-<pre-release>)"; exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"; exit 1
          fi
          # SwiftPM rejects a binary whose checksum changed under the same URL.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists; pick a new tag"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; pick a new tag"; exit 1
          fi
          echo "TAG=$TAG" >>"$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "XCODE_BUILD=$(xcodebuild -version | tail -1 | awk '{print $3}')" >>"$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          NDK_VERSION="$(python3 -c "import json; print(json.load(open('configs.json'))['android']['ndk'])")"
          echo "NDK_VERSION=$NDK_VERSION" >>"$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - run: corepack enable

      - name: Set up Conan
        run: yarn setup:conan

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_BUILD }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/**', 'requirements.txt') }}

      - name: Build Ogg, Opus, Vorbis, OpenSSL and FFmpeg (Conan)
        run: yarn build:conan

      - name: Pack
        run: yarn export

      - name: Verify
        run: yarn verify --release

      - name: Collect release assets
        run: |
          mkdir dist
          cp export/android.zip export/jniLibs.zip export/include_ffmpeg.zip dist/
          cp export/spm/*.xcframework.zip export/spm/checksums.txt dist/
          ls -la dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} with $(xcodebuild -version | head -1), NDK $NDK_VERSION. Versions: $(tr -d ' \n' < configs.json)"
